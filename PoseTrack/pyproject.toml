[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posetrack"
version = "0.1.0"
description = "PoseTrack: Monocular Arm Motion Tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.9",
    "opencv-python>=4.8.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "psutil>=5.9",
    "Pillow>=10.0",
    "tensorflow>=2.14",
    "tensorflow-hub>=0.15",
    "torch>=2.0.0",
    "pyyaml",
    "scipy",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "webapp*"]
