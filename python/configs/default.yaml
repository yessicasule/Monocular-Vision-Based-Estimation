# configs/default.yaml
# PoseTrack Base Settings

camera:
  id: 0
  width: 640
  height: 480

stream:
  udp_ip: "127.0.0.1"
  udp_port: 9000
  hz: 30.0

filter:
  default_type: "kalman"
  units: "degrees"

pose:
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  model_complexity: 1
  smooth_landmarks: true

record:
  duration: 60
  fps: 30
  codec: "mp4v"
