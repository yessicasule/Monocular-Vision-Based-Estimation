[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monoarm"
version = "0.1.0"
description = "MonoArm: Monocular Vision-Based Estimation of Human Arm Joint Angles for Real-Time Digital Avatar Control"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "mediapipe>=0.10.9,<1.0",
    "opencv-python>=4.8.1",
    "numpy>=1.26,<2",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "psutil>=5.9",
    "Pillow>=10.0",
    "tensorflow>=2.14,<2.18",
    "tensorflow-hub>=0.15",
    "protobuf>=4.25.3,<5",
    "pyyaml",
    "scipy"
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*", "webapp*"]
